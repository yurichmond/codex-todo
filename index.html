<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个使用原生 JavaScript 编写的 Todo List。" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="todo-app" aria-labelledby="page-title">
      <header class="todo-header">
        <p class="eyebrow">今日清单</p>
        <h1 id="page-title">Todo List</h1>
        <p class="subtitle">把想做的事情记下来，一件一件完成。</p>
        <small>Git diff demo</small>
      </header>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">新任务</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="输入一个新任务……"
          maxlength="120"
          autocomplete="off"
          required
        />
        <button type="submit">添加任务</button>
      </form>

      <div class="task-search">
        <label class="sr-only" for="task-search">搜索任务</label>
        <input
          id="task-search"
          class="search-input"
          type="search"
          placeholder="搜索任务……"
          autocomplete="off"
          aria-controls="todo-list"
        />
      </div>

      <div class="task-toolbar">
        <p id="task-summary" class="task-summary" aria-live="polite"></p>
        <div class="task-controls">
          <div id="filter-controls" class="filter-controls" role="group" aria-label="筛选任务">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">
              全部
            </button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">
              未完成
            </button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">
              已完成
            </button>
          </div>
          <button id="clear-completed" class="clear-completed-button" type="button" disabled>
            清除已完成
          </button>
        </div>
      </div>
      <ul id="todo-list" class="todo-list" aria-label="任务列表"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
